# Per-version dependency pins for Minecraft 1.21.1 (NeoForge only).
# Create dropped Forge after 1.20.1 and never made a 1.21.1 Fabric build,
# so this version targets NeoForge exclusively (see settings.gradle.kts).

deps.minecraft = 1.21.1

# Loaders
deps.neoforge_loader = 21.1.227
# fabric-loader is needed even on NeoForge for the @Environment annotations
# referenced by common code; it's compile-only and gets stripped at runtime.
deps.fabric_loader   = 0.16.10
deps.forge           = [UNSUPPORTED]

# Mappings
deps.parchment = 2024.11.17

# Architectury
deps.architectury_api = 13.0.8

# Create + Create Big Cannons (NeoForge-only on 1.21.1)
deps.create     = 6.0.10-281
deps.ponder     = 1.0.82+mc1.21.1
deps.flywheel   = 1.0.6
deps.catnip     = 0.8.54
# Create ships Registrate as a runtime dep; pull it in explicitly for compile.
deps.registrate = MC1.21-1.3.0+67
deps.cbc        = 5.11.2
deps.rpl        = 2.1.2+mc.1.21.1-neoforge

# JEI
deps.jei = [TODO]

# Valkyrien Skies 2 — no official 1.21.1 build as of 2026-04
# (track https://github.com/ValkyrienSkies/Valkyrien-Skies-2/issues/1049).
# The compat/vs2 package is gated as <1.21-only in source.
deps.vs2     = [UNSUPPORTED]
deps.vs_core = [UNSUPPORTED]

# Forge Config API Port (NeoForge build for 1.21.1)
deps.forge_config_api_port = 21.1.6

# Mod metadata constraints
mod.mc_dep_fabric    = [UNSUPPORTED]
mod.mc_dep_forgelike = [1.21, 1.21.1]
mod.mc_title         = 1.21.1
mod.mc_targets       = 1.21.1
